  <circle cx="320" cy="246" r="30" fill="none" stroke="#ffd966" stroke-width="8" stroke-dasharray="12 10"/>
  <path d="M320 226v26m0 14v2" stroke="#ffd966" stroke-width="8" stroke-linecap="round"/>
  <rect x="96" y="326" width="448" height="14" rx="7" fill="#0f2622"/>
  <text x="70" y="392" fill="#e8f3f0" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Press line inspection</text>
  <text x="70" y="422" fill="#9db8b2" font-family="Inter, system-ui, sans-serif" font-size="16">Guarding and interlocks under review</text>
  <rect x="70" y="440" width="132" height="8" rx="4" fill="#ff0000"/>
